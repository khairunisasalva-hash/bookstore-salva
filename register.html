<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Bookstore</title>
    <style>
        /* ===== Palet warna Bookstore =====
           Ubah nilai di bawah ini agar sama persis dengan halaman utama bookstore Anda. */
        :root {
            --bg-1: #f5ebdc;        /* krem kertas */
            --bg-2: #e3cfb0;        /* krem tua */
            --card: #fffaf2;        /* kartu */
            --primary: #6b4226;     /* cokelat kayu */
            --primary-dark: #4a2c17;
            --accent: #c8963e;      /* emas */
            --text: #3b2a1e;
            --muted: #7a6755;
            --border: #d9c6a8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: var(--card);
            padding: 32px 30px;
            border-radius: 12px;
            border-top: 5px solid var(--primary);
            box-shadow: 0 6px 18px rgba(74, 44, 23, 0.25);
            width: 100%;
            max-width: 400px;
        }

        .brand {
            text-align: center;
            margin-bottom: 6px;
        }

        .brand svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .register-container h2 {
            text-align: center;
            margin: 4px 0 4px;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 18px;
            font-size: 13px;
            color: var(--muted);
            font-style: italic;
        }

        .register-container label {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: var(--muted);
            display: block;
            margin-top: 10px;
        }

        .register-container input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            outline: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .register-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 5px rgba(200, 150, 62, 0.5);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            top: 6px;
            right: 5px;
            width: 36px;
            height: 38px;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .register-container .submit-button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: #fff8ec;
            font-size: 16px;
            font-family: Georgia, serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .register-container .submit-button:hover {
            background: var(--primary-dark);
        }

        .register-container .footer {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            font-family: Arial, sans-serif;
            color: var(--muted);
        }

        .register-container .footer p {
            margin: 0;
        }

        .register-container .footer a {
            color: var(--accent);
            font-weight: bold;
            text-decoration: none;
        }

        .register-container .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="brand">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"></path>
                <path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"></path>
                <path d="M9 8h7"></path>
            </svg>
        </div>
        <h2>Daftar Akun</h2>
        <p class="subtitle">Bergabunglah dan temukan buku favoritmu</p>

        <form id="registerForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="ttl">Tanggal Lahir</label>
            <input type="date" id="ttl" name="ttl" required>

            <label for="nohp">No HP</label>
            <input
                type="tel"
                id="nohp"
                name="nohp"
                pattern="[0-9]{10,13}"
                inputmode="numeric"
                placeholder="contoh: 081234567890"
                title="Masukkan nomor HP 10 sampai 13 digit"
                required
            >

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >
                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Tampilkan password"
                    aria-pressed="false"
                >
                    <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" class="submit-button">Daftar</button>

            <div class="footer">
                <p>Sudah punya akun? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        // Tampilkan atau sembunyikan password saat ikon mata ditekan.
        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.setAttribute("aria-pressed", String(isHidden));
            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Sembunyikan password" : "Tampilkan password"
            );

            eyeIcon.innerHTML = isHidden
                ? '<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"></path><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"></path>'
                : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>';
        });

        registerForm.addEventListener("submit", function (e) {
            e.preventDefault();

            // Ambil data dari form.
            const username = document.getElementById("username").value.trim();
            const ttl = document.getElementById("ttl").value;
            const nohp = document.getElementById("nohp").value.trim();
            const password = passwordInput.value;

            // Simpan data agar dapat digunakan oleh halaman login.
            const userData = { username, ttl, nohp, password };
            localStorage.setItem("userData", JSON.stringify(userData));

            alert("Akun berhasil dibuat!");

            // Arahkan ke halaman login.
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
