<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookstrip Bookstore</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#8B5E3C;--dark:#5C3A21;--light:#F5E6D3;--accent:#C49A6C;--text:#3E2723;--muted:#795548;--bg:#FFF8F0;--white:#fff;--border:#E6D5C3;--green:#16845b;--red:#c0392b;--shadow:0 8px 24px rgba(92,58,33,.09)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}body{background:var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.navbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:13px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:var(--shadow)}.brand{font-weight:800;font-size:21px;color:var(--primary);display:flex;gap:10px;align-items:center}.brand i{background:var(--light);padding:10px;border-radius:11px}.nav-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.badge{background:var(--light);color:var(--dark);padding:8px 12px;border-radius:20px;font-size:12px;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;transition:.2s}.btn:hover{filter:brightness(.94);transform:translateY(-1px)}.primary{background:var(--primary);color:#fff}.soft{background:var(--light);color:var(--dark)}.danger{background:#fde8e7;color:var(--red)}.outline{background:#fff;border:1px solid var(--border);color:var(--text)}.small{padding:7px 10px;font-size:12px}.container{max-width:1250px;margin:auto;padding:26px 20px 45px}.hero{background:linear-gradient(135deg,#A67B5B,#5C3A21);color:white;padding:35px;border-radius:22px;margin-bottom:24px;box-shadow:var(--shadow)}.hero h1{font-size:28px;margin-bottom:9px}.hero p{max-width:700px;line-height:1.7;font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.tab{border:1px solid var(--border);background:white;color:var(--dark);padding:10px 14px;border-radius:10px;font-weight:700}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 15px}.section-head h2{font-size:20px}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 24px}.stat,.panel,.card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;gap:13px;align-items:center}.stat i{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:var(--light);color:var(--primary);font-size:18px}.stat p{font-size:12px;color:var(--muted)}.stat strong{font-size:21px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;outline:none;background:#fff}.toolbar input{flex:1;min-width:220px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field textarea{min-height:90px;resize:vertical}.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.book-card{background:#fff;border:1px solid var(--border);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}.book-cover{height:205px;background:var(--light);padding:14px;display:flex;justify-content:center;align-items:center;position:relative}.book-cover img{height:100%;max-width:100%;object-fit:contain}.book-info{padding:15px;display:flex;flex-direction:column;gap:7px;flex:1}.book-info h3{font-size:15px}.book-info .author{font-size:12px;color:var(--muted)}.book-info .price{font-weight:800;color:var(--primary);margin-top:auto}.book-actions{display:flex;gap:6px;margin-top:9px}.book-actions .btn{flex:1}.tag{position:absolute;right:9px;top:9px;background:white;color:var(--primary);padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:13px}th{background:var(--light);color:var(--dark)}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px}.modal{display:none;position:fixed;inset:0;background:rgba(40,25,15,.55);z-index:50;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px;border-radius:18px}.modal-box h2{margin-bottom:17px;font-size:20px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.cart-row:last-child{border:0}.total{display:flex;justify-content:space-between;font-weight:800;color:var(--primary);padding:15px 0;border-top:2px dashed var(--border);margin-top:12px}.notice{padding:12px 14px;border-radius:10px;background:#f1eadf;color:var(--dark);font-size:13px;line-height:1.6;margin:12px 0}.hidden{display:none!important}.status{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:800;background:#fff0d8;color:#8a5a14}.status.done{background:#e3f5ec;color:#176b48}.status.cancel{background:#fde8e7;color:#a12d25}footer{text-align:center;background:var(--dark);color:var(--light);padding:22px;font-size:12px;margin-top:35px}
@media(max-width:950px){.book-grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.navbar{align-items:flex-start;flex-direction:column}.nav-right{width:100%}.book-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:25px}.hero h1{font-size:23px}}@media(max-width:430px){.book-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
</style></head>
<body>
<header class="navbar"><div class="brand"><i class="fa-solid fa-book-open"></i> Bookstrip Bookstore</div><div class="nav-right"><span class="badge" id="userBadge">Mode Demo</span><button class="btn outline small" onclick="switchRole()"><i class="fa-solid fa-arrows-rotate"></i> Ganti Peran</button><button class="btn danger small" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div></header>
<main class="container">
<section class="hero"><h1 id="welcomeTitle">Selamat Datang di Bookstrip 📚</h1><p id="welcomeText">Temukan berbagai koleksi buku pilihan. Kelola katalog, cari buku favorit, dan lakukan pemesanan dengan mudah.</p></section>
<nav class="tabs" id="tabs"></nav>
<section id="view"></section>
</main><footer>© 2026 Bookstrip Bookstore · Temukan Duniamu Lewat Buku 🤎</footer>

<div class="modal" id="modal"><div class="modal-box"><div id="modalContent"></div></div></div>
<script>
'use strict';
const KEY={books:'bookstrip_books_v3',cats:'bookstrip_categories_v3',users:'bookstrip_users_v3',orders:'bookstrip_orders_v3',messages:'bookstrip_messages_v3',cart:'bookstrip_cart_v3',session:'bookstrip_session_v3'};
const seedBooks=[
{id:1,title:'Laskar Pelangi',author:'Andrea Hirata',category:'Novel',publisher:'Bentang Pustaka',price:85000,stock:12,image:'https://covers.openlibrary.org/b/isbn/9789793062792-L.jpg',description:'Kisah perjuangan dan persahabatan anak-anak Belitung.'},
{id:2,title:'Bumi',author:'Tere Liye',category:'Fantasi',publisher:'Gramedia Pustaka Utama',price:95000,stock:8,image:'https://covers.openlibrary.org/b/isbn/9786020332956-L.jpg',description:'Petualangan fantasi di dunia paralel.'},
{id:3,title:'Atomic Habits',author:'James Clear',category:'Pengembangan Diri',publisher:'Avery',price:99000,stock:15,image:'https://covers.openlibrary.org/b/isbn/9780735211292-L.jpg',description:'Panduan membangun kebiasaan baik secara bertahap.'},
{id:4,title:'Filosofi Teras',author:'Henry Manampiring',category:'Pengembangan Diri',publisher:'Kompas',price:89000,stock:10,image:'https://covers.openlibrary.org/b/isbn/9786024125189-L.jpg',description:'Pengenalan filsafat Stoisisme untuk kehidupan sehari-hari.'},
{id:5,title:'Negeri 5 Menara',author:'Ahmad Fuadi',category:'Novel',publisher:'Gramedia',price:88000,stock:14,image:'https://covers.openlibrary.org/b/isbn/9789792248616-L.jpg',description:'Kisah persahabatan dan perjuangan meraih cita-cita.'},
{id:6,title:'Hujan',author:'Tere Liye',category:'Fiksi Ilmiah',publisher:'Gramedia',price:92000,stock:7,image:'https://covers.openlibrary.org/b/isbn/9786020324784-L.jpg',description:'Cerita tentang kenangan, persahabatan, dan masa depan.'},
{id:7,title:'Rich Dad Poor Dad',author:'Robert T. Kiyosaki',category:'Keuangan',publisher:'Plata Publishing',price:95000,stock:20,image:'https://covers.openlibrary.org/b/isbn/9781612680194-L.jpg',description:'Dasar pemahaman keuangan dan literasi finansial.'},
{id:8,title:'The Psychology of Money',author:'Morgan Housel',category:'Keuangan',publisher:'Harriman House',price:98000,stock:11,image:'https://covers.openlibrary.org/b/isbn/9780358239284-L.jpg',description:'Pelajaran tentang perilaku dan keputusan keuangan.'}
];
function read(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch(e){return fallback}}
function write(key,value){localStorage.setItem(key,JSON.stringify(value))}
let books=read(KEY.books,seedBooks),categories=read(KEY.cats,['Novel','Fantasi','Pengembangan Diri','Fiksi Ilmiah','Keuangan']),users=read(KEY.users,[{id:1,name:'Pengguna Demo',username:'user',email:'user@example.com',password:'user123'}]),orders=read(KEY.orders,[]),messages=read(KEY.messages,[]),cart=read(KEY.cart,{}),session=read(KEY.session,{role:'user',name:'Pengguna Demo',username:'user'}),activeTab='';
function persist(){write(KEY.books,books);write(KEY.cats,categories);write(KEY.users,users);write(KEY.orders,orders);write(KEY.messages,messages);write(KEY.cart,cart)}
function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isAdmin(){return session.role==='admin'}
function setSession(role,name,username){session={role,name,username};write(KEY.session,session);render()}
function switchRole(){openModal(`<h2>Pilih Peran Aplikasi</h2><p class="muted">Mode demo untuk mencoba fitur Admin dan User.</p><div class="notice">Admin demo: <b>admin</b> / <b>admin123</b><br>User demo: <b>user</b> / <b>user123</b></div><div class="field"><label>Peran</label><select id="rolePick"><option value="user">User</option><option value="admin">Admin</option></select></div><div class="field"><label>Nama tampilan</label><input id="roleName" value="${esc(session.name||'Pengguna')}" /></div><div class="modal-actions"><button class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary" onclick="applyRole()">Masuk</button></div>`)}
function applyRole(){const role=document.getElementById('rolePick').value,name=document.getElementById('roleName').value.trim()||'Pengguna';setSession(role,name,role==='admin'?'admin':'user');closeModal()}
function logout(){setSession('user','Pengguna Demo','user');activeTab='';render();alert('Anda telah keluar dari sesi demo.')}
function tabsForRole(){return isAdmin()?[['dashboard','Dashboard'],['books','Data Buku'],['categories','Kategori'],['users','Data User'],['orders','Pesanan'],['messages','Pesan Masuk']]:[['home','Beranda'],['about','About Us'],['contact','Contact Admin'],['cart','Keranjang'],['myorders','Pesanan Saya']]}
function render(){document.getElementById('userBadge').textContent=(isAdmin()?'ADMIN · ':'USER · ')+session.name;document.getElementById('welcomeTitle').textContent=isAdmin()?'Dashboard Admin Bookstrip':'Selamat Datang di Bookstrip 📚';document.getElementById('welcomeText').textContent=isAdmin()?'Kelola kategori, katalog buku, pengguna, pesanan, dan pesan pelanggan.':'Temukan berbagai koleksi buku pilihan. Cari buku favorit dan pesan dengan mudah.';const tabs=tabsForRole();if(!tabs.some(t=>t[0]===activeTab))activeTab=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');renderView()}
function go(tab){activeTab=tab;render()}
function renderView(){const v=document.getElementById('view');const map={dashboard:adminDashboard,books:adminBooks,categories:adminCategories,users:adminUsers,orders:adminOrders,messages:adminMessages,home:userHome,about:aboutPage,contact:contactPage,cart:cartPage,myorders:myOrders};v.innerHTML=(map[activeTab]||userHome)()}
function stats(){return `<div class="stats"><div class="stat"><i class="fa-solid fa-book"></i><div><p>Total Judul Buku</p><strong>${books.length}</strong></div></div><div class="stat"><i class="fa-solid fa-layer-group"></i><div><p>Total Kategori</p><strong>${categories.length}</strong></div></div><div class="stat"><i class="fa-solid fa-users"></i><div><p>Total User</p><strong>${users.length}</strong></div></div><div class="stat"><i class="fa-solid fa-receipt"></i><div><p>Total Pesanan</p><strong>${orders.length}</strong></div></div></div>`}
function adminDashboard(){return `${stats()}<div class="panel"><div class="section-head"><h2>Ringkasan Aktivitas</h2><span class="muted">Pemantauan data Bookstrip</span></div><p class="muted">Gunakan menu di atas untuk menambah, mengubah, dan menghapus kategori maupun buku, serta memeriksa pengguna, pesanan, dan pesan yang masuk.</p><div class="section-head"><h2>Pesanan Terbaru</h2><button class="btn soft small" onclick="go('orders')">Lihat Semua</button></div>${orders.length?orderTable(orders.slice().reverse().slice(0,5),true):'<div class="empty">Belum ada pesanan.</div>'}</div>`}
function adminBooks(){return `<div class="section-head"><h2>Kelola Data Buku</h2><button class="btn primary" onclick="bookForm()"><i class="fa fa-plus"></i> Tambah Buku</button></div><div class="toolbar"><input id="adminSearch" placeholder="Cari judul, penulis, atau kategori..." oninput="filterAdminBooks()"></div><div class="table-wrap"><table><thead><tr><th>Judul</th><th>Penulis</th><th>Kategori</th><th>Penerbit</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="adminBookRows">${bookRows(books)}</tbody></table></div>`}
function bookRows(list){return list.length?list.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${esc(b.publisher||'-')}</td><td>${rupiah(b.price)}</td><td>${b.stock}</td><td><button class="btn soft small" onclick="bookForm(${b.id})">Edit</button> <button class="btn danger small" onclick="deleteBook(${b.id})">Hapus</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Data buku tidak ditemukan.</td></tr>'}
function filterAdminBooks(){const q=document.getElementById('adminSearch').value.toLowerCase();document.getElementById('adminBookRows').innerHTML=bookRows(books.filter(b=>[b.title,b.author,b.category].some(x=>String(x).toLowerCase().includes(q))))}
function bookForm(id=null){const b=books.find(x=>x.id===id)||{title:'',author:'',category:categories[0]||'',publisher:'',price:'',stock:'',image:'',description:''};openModal(`<h2>${id?'Ubah':'Tambah'} Data Buku</h2><form id="bookForm" onsubmit="saveBook(event,${id??'null'})"><div class="field"><label>Judul Buku</label><input name="title" required value="${esc(b.title)}"></div><div class="two-col"><div class="field"><label>Penulis</label><input name="author" required value="${esc(b.author)}"></div><div class="field"><label>Kategori</label><select name="category" required>${categories.map(c=>`<option ${c===b.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="field"><label>Penerbit</label><input name="publisher" value="${esc(b.publisher)}"></div><div class="two-col"><div class="field"><label>Harga (Rp)</label><input name="price" type="number" min="0" required value="${b.price}"></div><div class="field"><label>Stok</label><input name="stock" type="number" min="0" required value="${b.stock}"></div></div><div class="field"><label>URL Gambar Sampul</label><input name="image" type="url" value="${esc(b.image)}" placeholder="https://..."></div><div class="field"><label>Deskripsi</label><textarea name="description">${esc(b.description)}</textarea></div><div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`)}
function saveBook(e,id){e.preventDefault();const f=new FormData(e.target),item={id:id??Date.now(),title:f.get('title').trim(),author:f.get('author').trim(),category:f.get('category'),publisher:f.get('publisher').trim(),price:Number(f.get('price')),stock:Number(f.get('stock')),image:f.get('image').trim()||'https://placehold.co/240x320/F5E6D3/8B5E3C?text=Bookstrip',description:f.get('description').trim()};if(id)books=books.map(b=>b.id===id?item:b);else books.unshift(item);persist();closeModal();renderView()}
function deleteBook(id){const b=books.find(x=>x.id===id);if(!b||!confirm(`Hapus buku "${b.title}"?`))return;books=books.filter(x=>x.id!==id);delete cart[id];persist();renderView()}
function adminCategories(){return `<div class="section-head"><h2>Kelola Kategori Buku</h2><button class="btn primary" onclick="categoryForm()"><i class="fa fa-plus"></i> Tambah Kategori</button></div><div class="table-wrap"><table><thead><tr><th>Nama Kategori</th><th>Jumlah Buku</th><th>Aksi</th></tr></thead><tbody>${categories.map(c=>`<tr><td>${esc(c)}</td><td>${books.filter(b=>b.category===c).length}</td><td><button class="btn soft small" onclick="categoryForm('${esc(c).replace(/'/g,'&#39;')}')">Edit</button> <button class="btn danger small" onclick="deleteCategory('${esc(c).replace(/'/g,'&#39;')}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada kategori.</td></tr>'}</tbody></table></div>`}
function categoryForm(old=''){openModal(`<h2>${old?'Ubah':'Tambah'} Kategori</h2><div class="field"><label>Nama Kategori</label><input id="categoryName" value="${esc(old)}" placeholder="Contoh: Sejarah"></div><div class="modal-actions"><button class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveCategory('${esc(old).replace(/'/g,"\\'")}')">Simpan</button></div>`)}
function saveCategory(old){const name=document.getElementById('categoryName').value.trim();if(!name)return alert('Nama kategori wajib diisi.');if(categories.some(c=>c.toLowerCase()===name.toLowerCase()&&c!==old))return alert('Kategori sudah tersedia.');if(old){categories=categories.map(c=>c===old?name:c);books=books.map(b=>b.category===old?{...b,category:name}:b)}else categories.push(name);persist();closeModal();renderView()}
function deleteCategory(c){if(books.some(b=>b.category===c))return alert('Kategori masih digunakan oleh buku. Ubah kategori buku terlebih dahulu.');if(!confirm(`Hapus kategori ${c}?`))return;categories=categories.filter(x=>x!==c);persist();renderView()}
function adminUsers(){return `<div class="section-head"><h2>Daftar User Terdaftar</h2><span class="muted">${users.length} pengguna</span></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Email</th><th>Tanggal Daftar</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.email||'-')}</td><td>${esc(u.joined||'-')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada user.</td></tr>'}</tbody></table></div>`}
function orderTable(list,admin=false){return `<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Pemesan</th><th>Detail</th><th>Total</th><th>Pembayaran</th><th>Status</th>${admin?'<th>Aksi</th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td>${esc(o.code)}</td><td>${esc(o.name)}<br><span class="muted">${esc(o.username||'')}</span></td><td>${o.items.map(i=>`${esc(i.title)} × ${i.qty}`).join('<br>')}</td><td>${rupiah(o.total)}</td><td>${esc(o.payment)}</td><td><span class="status ${o.status==='Selesai'?'done':o.status==='Dibatalkan'?'cancel':''}">${esc(o.status)}</span></td>${admin?`<td><select onchange="updateOrder('${o.id}',this.value)"><option ${o.status==='Menunggu Konfirmasi'?'selected':''}>Menunggu Konfirmasi</option><option ${o.status==='Diproses'?'selected':''}>Diproses</option><option ${o.status==='Dikirim'?'selected':''}>Dikirim</option><option ${o.status==='Selesai'?'selected':''}>Selesai</option><option ${o.status==='Dibatalkan'?'selected':''}>Dibatalkan</option></select></td>`:''}</tr>`).join('')||`<tr><td colspan="${admin?7:6}" class="empty">Belum ada pesanan.</td></tr>`}</tbody></table></div>`}
function adminOrders(){return `<div class="section-head"><h2>Daftar Pesanan User</h2><span class="muted">${orders.length} pesanan</span></div>${orderTable(orders.slice().reverse(),true)}`}
function updateOrder(id,status){orders=orders.map(o=>o.id===id?{...o,status}:o);persist();renderView()}
function adminMessages(){return `<div class="section-head"><h2>Pesan dari User</h2><span class="muted">${messages.length} pesan</span></div><div class="table-wrap"><table><thead><tr><th>Pengirim</th><th>Email</th><th>Pesan</th><th>Tanggal</th></tr></thead><tbody>${messages.slice().reverse().map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${esc(m.message)}</td><td>${esc(m.date)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pesan masuk.</td></tr>'}</tbody></table></div>`}
function userHome(){return `<div class="section-head"><h2>Katalog Buku</h2><span class="muted">Pilih buku favoritmu</span></div><div class="toolbar"><input id="bookSearch" placeholder="Cari judul, penulis, atau kategori..." oninput="filterBooks()"><select id="categoryFilter" onchange="filterBooks()" style="max-width:220px;padding:10px;border:1px solid var(--border);border-radius:9px"><option value="">Semua Kategori</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="bookGrid" class="book-grid">${bookCards(books)}</div>`}
function bookCards(list){return list.map(b=>`<article class="book-card"><div class="book-cover"><span class="tag">${esc(b.category)}</span><img src="${esc(b.image)}" alt="Sampul ${esc(b.title)}" onerror="this.src='https://placehold.co/240x320/F5E6D3/8B5E3C?text=Bookstrip'"></div><div class="book-info"><h3>${esc(b.title)}</h3><p class="author">${esc(b.author)} · ${esc(b.publisher||'')}</p><p class="muted">${esc(b.description||'')}</p><p class="price">${rupiah(b.price)}</p><p class="muted">Stok: ${b.stock}</p><div class="book-actions"><button class="btn primary" ${b.stock<=0?'disabled':''} onclick="addCart(${b.id})"><i class="fa fa-cart-plus"></i> Tambah</button><button class="btn soft" onclick="detailBook(${b.id})">Detail</button></div></div></article>`).join('')||'<div class="empty">Buku tidak ditemukan.</div>'}
function filterBooks(){const q=(document.getElementById('bookSearch')?.value||'').toLowerCase(),c=document.getElementById('categoryFilter')?.value||'';document.getElementById('bookGrid').innerHTML=bookCards(books.filter(b=>(!c||b.category===c)&&[b.title,b.author,b.category].some(x=>x.toLowerCase().includes(q))))}
function detailBook(id){const b=books.find(x=>x.id===id);if(!b)return;openModal(`<h2>${esc(b.title)}</h2><p><b>Penulis:</b> ${esc(b.author)}</p><p><b>Penerbit:</b> ${esc(b.publisher||'-')}</p><p><b>Kategori:</b> ${esc(b.category)}</p><p><b>Harga:</b> ${rupiah(b.price)}</p><p><b>Stok:</b> ${b.stock}</p><p class="notice">${esc(b.description||'Tidak ada deskripsi.')}</p><div class="modal-actions"><button class="btn outline" onclick="closeModal()">Tutup</button><button class="btn primary" onclick="addCart(${b.id});closeModal()">Tambah ke Keranjang</button></div>`)}
function addCart(id){const b=books.find(x=>x.id===id);if(!b||b.stock<=0)return alert('Stok buku tidak tersedia.');if((cart[id]||0)>=b.stock)return alert('Jumlah telah mencapai batas stok.');cart[id]=(cart[id]||0)+1;write(KEY.cart,cart);alert('Buku berhasil ditambahkan ke keranjang.')}
function aboutPage(){return `<div class="panel"><h2>About Us</h2><p style="line-height:1.9;margin-top:12px">Bookstrip Bookstore merupakan toko buku yang menyediakan berbagai pilihan bacaan, mulai dari novel, fantasi, pengembangan diri, hingga buku keuangan. Kami hadir untuk memudahkan pembaca menemukan buku yang sesuai dengan minat dan kebutuhan mereka.</p><div class="notice"><b>Visi:</b> Menjadi toko buku yang memudahkan masyarakat memperoleh bahan bacaan berkualitas.<br><b>Misi:</b> Menyediakan katalog buku yang beragam, memberikan informasi produk yang jelas, dan melayani pemesanan dengan mudah.</div><p class="muted">Selamat membaca dan temukan dunia baru melalui buku!</p></div>`}
function contactPage(){return `<div class="panel"><h2>Contact to Admin</h2><p class="muted" style="margin:8px 0 18px">Kirim pertanyaan, kritik, atau saran kepada admin Bookstrip.</p><form onsubmit="sendMessage(event)"><div class="field"><label>Nama</label><input name="name" required value="${esc(session.name)}"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="nama@email.com"></div><div class="field"><label>Pesan</label><textarea name="message" required placeholder="Tuliskan pesan Anda..."></textarea></div><button class="btn primary">Kirim Pesan</button></form></div>`}
function sendMessage(e){e.preventDefault();const f=new FormData(e.target);messages.push({id:Date.now(),name:f.get('name').trim(),email:f.get('email').trim(),message:f.get('message').trim(),date:new Date().toLocaleString('id-ID')});persist();e.target.reset();alert('Pesan berhasil dikirim kepada admin.');go('home')}
function cartEntries(){return Object.entries(cart).map(([id,qty])=>({book:books.find(b=>b.id==id),qty:Number(qty)})).filter(x=>x.book&&x.qty>0)}
function cartPage(){const entries=cartEntries(),total=entries.reduce((s,x)=>s+x.book.price*x.qty,0);return `<div class="section-head"><h2>Keranjang Belanja</h2><span class="muted">${entries.reduce((s,x)=>s+x.qty,0)} item</span></div><div class="panel">${entries.map(x=>`<div class="cart-row"><div><b>${esc(x.book.title)}</b><p class="muted">${rupiah(x.book.price)} × ${x.qty}</p></div><div><button class="btn soft small" onclick="changeQty(${x.book.id},-1)">−</button> <button class="btn soft small" onclick="changeQty(${x.book.id},1)">+</button> <button class="btn danger small" onclick="removeCart(${x.book.id})">Hapus</button></div></div>`).join('')||'<div class="empty">Keranjang masih kosong. Silakan pilih buku dari Beranda.</div>'}<div class="total"><span>Total Belanja</span><span>${rupiah(total)}</span></div><button class="btn primary" ${entries.length?'':'disabled'} onclick="checkoutForm()">Lanjut Checkout</button></div>`}
function changeQty(id,d){const b=books.find(x=>x.id===id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(n<=b.stock)cart[id]=n;else return alert('Jumlah melebihi stok.');write(KEY.cart,cart);renderView()}
function removeCart(id){delete cart[id];write(KEY.cart,cart);renderView()}
function checkoutForm(){const entries=cartEntries();if(!entries.length)return alert('Keranjang masih kosong.');const total=entries.reduce((s,x)=>s+x.book.price*x.qty,0);openModal(`<h2>Checkout Pesanan</h2><form onsubmit="submitOrder(event)"><div class="field"><label>Nama Lengkap</label><input name="name" required value="${esc(session.name)}"></div><div class="field"><label>Nomor Telepon</label><input name="phone" required placeholder="08xxxxxxxxxx"></div><div class="field"><label>Alamat Pengiriman</label><textarea name="address" required placeholder="Alamat lengkap penerima"></textarea></div><div class="field"><label>Metode Pembayaran</label><select name="payment"><option>Transfer Bank (simulasi)</option><option>Pembayaran sebelum pengiriman (simulasi)</option></select></div><div class="notice">Total pembayaran: <b>${rupiah(total)}</b><br>Ini adalah simulasi pembayaran. Tidak ada transaksi atau transfer uang sungguhan yang dilakukan oleh halaman ini.</div><div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary">Buat Pesanan</button></div></form>`)}
function submitOrder(e){e.preventDefault();const f=new FormData(e.target),entries=cartEntries();if(!entries.length)return alert('Keranjang kosong.');for(const x of entries){if(x.qty>x.book.stock)return alert(`Stok ${x.book.title} tidak mencukupi.`)}const total=entries.reduce((s,x)=>s+x.book.price*x.qty,0);const order={id:String(Date.now()),code:'BS-'+Date.now().toString().slice(-8),name:f.get('name').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),username:session.username||'user',items:entries.map(x=>({title:x.book.title,qty:x.qty,price:x.book.price})),total,payment:f.get('payment'),status:'Menunggu Konfirmasi',date:new Date().toLocaleString('id-ID')};orders.push(order);entries.forEach(x=>x.book.stock-=x.qty);cart={};persist();closeModal();alert(`Pesanan ${order.code} berhasil dibuat. Admin akan memproses pesanan Anda.`);go('myorders')}
function myOrders(){const mine=orders.filter(o=>o.username===(session.username||'user'));return `<div class="section-head"><h2>Pesanan Saya</h2></div>${orderTable(mine.slice().reverse(),false)}`}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
// Hubungkan akun dari halaman login/register terpisah bila tersedia di localStorage/sessionStorage.
(function init(){const extRole=sessionStorage.getItem('activeRole')||localStorage.getItem('activeRole');const extName=sessionStorage.getItem('activeUsername')||localStorage.getItem('activeUsername');if(extRole&&['admin','user'].includes(extRole)){session.role=extRole;session.name=extName||session.name;session.username=extName||session.username;write(KEY.session,session)}if(!session||!['admin','user'].includes(session.role))session={role:'user',name:'Pengguna Demo',username:'user'};render()})();
</script></body></html>
